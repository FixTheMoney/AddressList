<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin Balance Checker | ビットコイン残高チェッカー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --btc-orange: #f7931a;
      --btc-dark:   #1a1a2e;
      --text-main:  #e8eaf0;
      --text-muted: #8892a4;
      --green:      #00d26a;
      --red:        #ff5252;
      --border:     rgba(247,147,26,.25);
      --card-bg:    rgba(15,52,96,.45);
      --radius:     12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background: var(--btc-dark);
      color: var(--text-main);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(247,147,26,.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(233,69,96,.06) 0%, transparent 60%);
    }

    /* ── HEADER (compact) ── */
    header {
      background: rgba(22,33,62,.9);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 34px; height: 34px;
      background: var(--btc-orange);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
      box-shadow: 0 0 14px rgba(247,147,26,.5);
      flex-shrink: 0;
    }
    .logo-text h1 { font-size: 1.05rem; font-weight: 700; }
    .logo-text p  { font-size: .72rem; color: var(--text-muted); margin-top: 1px; }

    .lang-toggle { display: flex; gap: 8px; }
    .lang-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: .8rem;
      font-weight: 500;
      transition: all .2s;
    }
    .lang-btn.active { background: var(--btc-orange); border-color: var(--btc-orange); color: #fff; }
    .lang-btn:hover:not(.active) { border-color: var(--btc-orange); color: var(--btc-orange); }

    /* ── LAYOUT: input left, results right ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      align-items: start;
    }
    .side { display: flex; flex-direction: column; gap: 16px; }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    /* ── INPUT ── */
    .input-section { padding: 16px; }
    .input-section label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      color: var(--btc-orange);
      margin-bottom: 8px;
      letter-spacing: .4px;
      text-transform: uppercase;
    }
    textarea {
      width: 100%;
      height: 260px;
      background: rgba(10,10,30,.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: 'Courier New', monospace;
      font-size: .78rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      white-space: pre;
      overflow: auto;
    }
    textarea:focus { border-color: var(--btc-orange); box-shadow: 0 0 0 3px rgba(247,147,26,.15); }
    textarea::placeholder { color: var(--text-muted); font-size: .76rem; }
    .input-hint { font-size: .72rem; color: var(--text-muted); margin-top: 6px; }

    .btn-row { display: flex; gap: 10px; margin-top: 12px; }
    .btn {
      padding: 9px 18px;
      border-radius: 8px;
      border: none;
      font-size: .84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--btc-orange); color: #fff; box-shadow: 0 4px 14px rgba(247,147,26,.3); }
    .btn-primary:hover { transform: translateY(-1px); }
    .btn-secondary { background: rgba(255,255,255,.07); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(255,255,255,.13); color: var(--text-main); }

    /* ── REFRESH BAR ── */
    .refresh-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      flex-wrap: wrap;
    }
    .refresh-info { font-size: .8rem; color: var(--text-muted); }
    .refresh-info .countdown { color: var(--btc-orange); font-weight: 700; font-size: .95rem; }
    .last-updated { display: block; font-size: .72rem; margin-top: 2px; }
    .progress-ring-wrap { display: flex; align-items: center; gap: 8px; }
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring circle { transition: stroke-dashoffset .9s linear; }

    /* ── RESULTS: ONE container ── */
    .results-panel { overflow: hidden; }

    .results-top {
      display: flex;
      align-items: stretch;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,30,.35);
    }
    .stat { flex: 1; padding: 10px 16px; border-right: 1px solid rgba(255,255,255,.06); min-width: 0; }
    .stat:last-child { border-right: none; }
    .stat .s-label { font-size: .68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .stat .s-value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; white-space: nowrap; }
    .stat .s-sub   { font-size: .72rem; color: var(--green); }
    .orange { color: var(--btc-orange); }
    .green  { color: var(--green); }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      font-size: .68rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    th.num, td.num { text-align: right; }
    tbody td {
      padding: 9px 12px;
      font-size: .84rem;
      border-bottom: 1px solid rgba(255,255,255,.05);
      white-space: nowrap;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(247,147,26,.06); }
    td.idx { color: var(--text-muted); font-size: .75rem; width: 28px; }
    td.addr { font-family: 'Courier New', monospace; font-size: .8rem; }
    td.addr a { color: var(--text-main); text-decoration: none; border-bottom: 1px dotted var(--text-muted); }
    td.addr a:hover { color: var(--btc-orange); border-color: var(--btc-orange); }
    td.btc { color: var(--btc-orange); font-weight: 700; }
    td.usd { color: var(--green); font-size: .8rem; }
    td.txs { color: var(--text-muted); font-size: .78rem; }
    .mempool { color: var(--btc-orange); font-size: .7rem; }

    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
    .dot.ok  { background: var(--green); box-shadow: 0 0 5px var(--green); }
    .dot.err { background: var(--red);   box-shadow: 0 0 5px var(--red); }
    .err-text { color: var(--red); font-size: .78rem; }
    tr.row-error td.addr a { color: var(--red); }

    .empty-state { text-align: center; padding: 70px 20px; color: var(--text-muted); font-size: .88rem; line-height: 1.7; }
    .empty-state .icon { font-size: 2.4rem; margin-bottom: 8px; color: var(--btc-orange); opacity: .6; }

    .spinner-inline {
      display: inline-block; width: 13px; height: 13px;
      border: 2px solid var(--border); border-top-color: var(--btc-orange);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .table-scroll { overflow-x: auto; }

    /* ── RESPONSIVE ── */
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      textarea { height: 200px; }
    }
    @media (max-width: 560px) {
      header { padding: 10px 14px; }
      .logo-text p { display: none; }
      tbody td, thead th { padding: 8px 8px; }
      td.txs, th.txs { display: none; }
      .stat { padding: 8px 10px; }
      .stat .s-value { font-size: .9rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">₿</div>
    <div class="logo-text">
      <h1 data-en="Bitcoin Balance Checker" data-ja="ビットコイン残高チェッカー">Bitcoin Balance Checker</h1>
      <p data-en="Balance lookup for up to 10 addresses" data-ja="最大10アドレスの残高照会">Balance lookup for up to 10 addresses</p>
    </div>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btn-ja" onclick="setLang('ja')">日本語</button>
  </div>
</header>

<main>

  <!-- LEFT: input + refresh -->
  <div class="side">
    <section class="panel input-section">
      <label for="addr-input"
             data-en="Bitcoin addresses (one per line, max 10)"
             data-ja="ビットコインアドレス（1行1件、最大10件）">Bitcoin addresses (one per line, max 10)</label>
      <textarea id="addr-input" spellcheck="false" autocomplete="off"
        data-en-placeholder="One address per line…&#10;1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa&#10;3J98t1WpEZ73CNmQviecrnyiWrnqRhWNLy"
        data-ja-placeholder="1行に1アドレス…&#10;1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa&#10;3J98t1WpEZ73CNmQviecrnyiWrnqRhWNLy"></textarea>
      <p class="input-hint"
         data-en="Supports 1..., 3... and bc1... formats."
         data-ja="1...、3...、bc1... 形式に対応しています。">Supports 1..., 3... and bc1... formats.</p>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="fetchAll()">
          <span>🔍</span>
          <span data-en="Check Balances" data-ja="残高を確認">Check Balances</span>
        </button>
        <button class="btn btn-secondary" onclick="clearAll()">
          <span data-en="Clear" data-ja="クリア">Clear</span>
        </button>
      </div>
    </section>

    <div class="panel refresh-bar" id="refresh-bar">
      <div class="refresh-info">
        <span data-en="Auto-refresh in" data-ja="次回更新まで">Auto-refresh in</span>
        <span class="countdown" id="countdown">60</span>s
        <span class="last-updated" id="last-updated"></span>
      </div>
      <div class="progress-ring-wrap">
        <svg class="progress-ring" width="30" height="30" aria-hidden="true">
          <circle cx="15" cy="15" r="12" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/>
          <circle id="ring-fill" cx="15" cy="15" r="12" fill="none" stroke="#f7931a" stroke-width="3"
            stroke-dasharray="75.4" stroke-dashoffset="0" stroke-linecap="round"/>
        </svg>
        <button class="btn btn-secondary" style="padding:5px 12px;font-size:.78rem" onclick="fetchAll()">
          <span data-en="↺ Refresh" data-ja="↺ 更新">↺ Refresh</span>
        </button>
      </div>
    </div>
  </div>

  <!-- RIGHT: single results container -->
  <section class="panel results-panel" id="results-area" aria-live="polite"></section>

</main>

<script src="app.js"></script>
</body>
</html>
